services:
  # Serviço de inicialização do Kafka
  kafka-kraft-init:
    image: confluentinc/cp-kafka:latest
    user: root
    networks:
      - broker-kafka
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -f /var/lib/kafka/data/meta.properties ]; then
          echo 'Kafka já está formatado.'
        else
          echo 'Formatando o volume de Kafka...'
          KAFKA_CLUSTER_ID=$$(kafka-storage random-uuid)
          echo "CLUSTER_ID gerado: $${KAFKA_CLUSTER_ID}"
          mkdir -p /tmp/kraft-config
          cat > /tmp/kraft-config/server.properties <<'EOF'
        process.roles=broker,controller
        node.id=1
        controller.quorum.voters=1@localhost:9093
        listeners=PLAINTEXT://:9092,CONTROLLER://:9093
        log.dirs=/var/lib/kafka/data
        EOF
          kafka-storage format -t "$${KAFKA_CLUSTER_ID}" -c /tmp/kraft-config/server.properties
          echo 'Formatação concluída!'
        fi
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Serviço principal Kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    networks:
      - broker-kafka
    depends_on:
      kafka-kraft-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafdrop UI
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    networks:
      - broker-kafka
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:29092"
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXTPATH: "/"

  # --- NUEVO SERVICIO: Kafka UI ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks:
      - broker-kafka
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080" # El puerto estándar para Kafka UI es 8080
    environment:
      # Configuración del cluster de Kafka
      KAFKA_CLUSTERS_0_NAME: 'local-kafka-cluster'
      # Se conecta al listener interno de Kafka, igual que Kafdrop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:29092'
      # Habilitar la configuración dinámica desde la UI
      DYNAMIC_CONFIG_ENABLED: 'true'
      
  # MongoDB
  mongo:
    image: mongo:latest
    restart: always
    networks:
      - broker-kafka
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mongo Express UI
  mongo-express:
    image: mongo-express:latest
    restart: always
    networks:
      - broker-kafka
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH: false

networks:
  broker-kafka:
    driver: bridge

volumes:
  kafka-data:
  mongo-data:
